# GitHub only keeps traffic (views, clones, referrers) for 14 days.
# This snapshots it daily into the `github-repo-stats` branch so the history is never lost,
# and renders a report at IOxee/Cubezon/latest-report/report.md on that branch.
name: Repo stats

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Collect traffic and build report
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          # Fine-grained PAT scoped to this repo: Administration (read) for traffic, Contents (read/write) to push the data branch.
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats
