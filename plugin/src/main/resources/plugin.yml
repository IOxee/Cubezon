name: Cubezon
version: '${version}'
main: es.fractalgamestudios.cubezon.CubezonPlugin
api-version: '1.21'
description: Web marketplace for in-game items with pickup from lockers.
license: CC-BY-NC-SA-4.0
depend: [Vault]
softdepend: [ItemsAdder, MMOItems, CraftEngine, Nexo, Oraxen, Slimefun, EcoItems, CustomJukebox]
permissions:
  cubezon.use:
    description: Use /cubezon and all player features.
    default: true
    children:
      cubezon.link: true
      cubezon.deposit: true
      cubezon.pickup: true
      cubezon.buy.computer: true
      cubezon.buy.mailbox: true
      cubezon.buy.storage: true
  cubezon.link:
    description: Link the account with the website (/cz link).
    default: true
  cubezon.deposit:
    description: Deposit stock (/cz deposit).
    default: true
  cubezon.pickup:
    description: Pick up orders at a locker (/cz pickup).
    default: true
  cubezon.buy.computer:
    description: Buy company computers.
    default: true
  cubezon.buy.mailbox:
    description: Buy mailboxes.
    default: true
  cubezon.buy.storage:
    description: Buy storage blocks.
    default: true
  cubezon.admin:
    description: Administer Cubezon (all admin permissions).
    default: op
    children:
      cubezon.admin.give: true
      cubezon.admin.storage-types: true
      cubezon.admin.locker: true
      cubezon.admin.shop: true
      cubezon.admin.item: true
      cubezon.admin.reload: true
      cubezon.admin.panel: true
      cubezon.admin.terminal: true
      cubezon.admin.bypass: true
  cubezon.admin.give:
    description: Give computers, storage blocks and mailboxes (/cz ... give).
    default: op
  cubezon.admin.storage-types:
    description: Create, remove and list storage types.
    default: op
  cubezon.admin.locker:
    description: Create, remove and list lockers.
    default: op
  cubezon.admin.shop:
    description: Mark shop zones and set shop slot quotas.
    default: op
  cubezon.admin.item:
    description: Register items in the web catalog.
    default: op
  cubezon.admin.reload:
    description: Reload the configuration (/cz reload).
    default: op
  cubezon.admin.panel:
    description: Open the server features panel.
    default: op
  cubezon.admin.terminal:
    description: Create and remove Cubezon Stores (/cz kiosk).
    default: op
  cubezon.admin.bypass:
    description: Manage any shop as if you were its owner.
    default: op